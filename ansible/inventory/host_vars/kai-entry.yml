---
# kai-entry in AWS: Zugang ueber SSM Session Manager (Phase 3).
# Instanz-ID und Profil traegt Uwe nach dem Anlegen der Instanz ein.
kai_instance_id: ""
ansible_user: admin
# In AWS muss das Datenvolume da sein; die Rolle bricht sonst ab.
kai_volume_required: true
# Der Host, dessen Modelle LiteLLM ausliefert (kai_gpu_models).
kai_gpu_peer: kai-gpu
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="aws ssm start-session --target {{ kai_instance_id }}
  --region {{ kai_aws_region }} --profile {{ kai_aws_profile }}
  --document-name AWS-StartSSHSession --parameters portNumber=%p"
# Das Volume kai-data fehlt noch (Bestandsaufnahme 2.1); danach hier den Pfad eintragen:
# nvme-Amazon_Elastic_Block_Store_vol<ID ohne Bindestrich>. Leer: die Rolle bricht ab.
kai_volume_device: ""
