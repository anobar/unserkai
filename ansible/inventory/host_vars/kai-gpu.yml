---
# kai-gpu in AWS (g4dn.xlarge, NVIDIA T4): Zugang ueber SSM Session Manager (Phase 3).
kai_instance_id: ""
ansible_user: admin
# In AWS muss das Datenvolume da sein; die Rolle bricht sonst ab.
kai_volume_required: true
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="aws ssm start-session --target {{ kai_instance_id }}
  --region {{ kai_aws_region }} --profile {{ kai_aws_profile }}
  --document-name AWS-StartSSHSession --parameters portNumber=%p"

# Maschinendaten (kai/docs/03_modellvorschlag.md)
kai_gpu_vram_gb: 16
kai_gpu_models:
  - name: gpt-oss-20b
    file: gpt-oss-20b-MXFP4.gguf
    ctx_size: 32768
    reasoning_effort: medium
# Nur das EBS-Volume; das Instance Storage (nvme1n1) heisst Amazon_EC2_NVMe_Instance_Storage und passt nicht.
kai_volume_by_id:
  - nvme-Amazon_Elastic_Block_Store_*
