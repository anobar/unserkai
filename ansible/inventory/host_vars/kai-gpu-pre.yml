---
# Test-VM ohne GPU im Heimnetz; Adresse und Proxy stehen im Overlay inventory/local/.
ansible_user: admin
kai_gpu_enabled: false
kai_gpu_vram_gb: 0
kai_gpu_models:
  - name: qwen3-0.6b
    file: Qwen3-0.6B-Q8_0.gguf
    ctx_size: 4096
# Der Treiber der Test-VM gibt der Datenplatte (vdc) die Seriennummer kai-models, die Platte vdb (scratch) keine.
kai_volume_required: true
# Datenplatte (Seriennummer = Label); die Ersatzplatte fuer das Instance Storage heisst virtio-kai-scratch.
kai_volume_device: /dev/disk/by-id/virtio-kai-models
