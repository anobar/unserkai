---
# Test-VM im Heimnetz mit dem Image von kai-entry; Adresse und Proxy stehen im Overlay inventory/local/.
ansible_user: admin
# Der Host, dessen Modelle LiteLLM ausliefert (kai_gpu_models).
kai_gpu_peer: kai-gpu-pre
# Der Treiber der Test-VM gibt der Datenplatte die Seriennummer kai-data.
kai_volume_required: true
# Datenplatte (Seriennummer = Label, vom Treiber der Test-VM gesetzt).
kai_volume_device: /dev/disk/by-id/virtio-kai-data
