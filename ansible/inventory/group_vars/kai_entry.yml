---
# Stack-Variablen fuer kai-entry und kai-entry-pre.

# Der einzige Weg zu kai-gpu: DNS-Name, nie eine IP (Architektur E11).
kai_gpu_endpoint: "http://kai1.unserkai.de:8080"

# Adresse, auf der Open WebUI (3000) und LiteLLM (4000) lauschen.
kai_webui_bind: "127.0.0.1"
kai_litellm_bind: "127.0.0.1"
kai_webui_port: 3000
kai_litellm_port: 4000

# Datenvolume: per Label eingebunden, nie per Geraetename (Architektur E4).
kai_volume_label: kai-data
kai_volume_mountpoint: /opt/kai
# Sekunden, die LiteLLM auf kai-gpu wartet (Verbindungsaufbau und je Antwortstueck). Muss das Laden
# eines Modells von EBS abdecken (bis ~120 s); bei gestoppter kai-gpu kommt der Fehler nach dieser Zeit.
kai_litellm_request_timeout: 180
