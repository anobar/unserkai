---
# Stack-Variablen fuer kai-entry und kai-entry-pre.

# Der einzige Weg zu kai-gpu: DNS-Name, nie eine IP (Architektur E11).
kai_gpu_endpoint: "http://kai1.unserkai.de:8080"
# Adresse, auf der Open WebUI (3000) und LiteLLM (4000) lauschen: alle Schnittstellen, weil die Security Group
# den Zugang auf das VPN begrenzt (kai/docs/01_architektur.md); Harnesses erreichen LiteLLM damit direkt aus dem VPN.
kai_webui_bind: "0.0.0.0"
kai_litellm_bind: "0.0.0.0"
kai_webui_port: 3000
kai_litellm_port: 4000

# Datenvolume: per Label eingebunden, nie per Geraetename (Architektur E4).
kai_volume_label: kai-data
kai_volume_mountpoint: /opt/kai
# Sekunden, die LiteLLM auf kai-gpu wartet (Verbindungsaufbau und je Antwortstueck). Muss den Kaltstart
# abdecken, den der Pfoertner festhaelt (Start + Modell laden, etwa 3 min, Reserve bis 6 min).
kai_litellm_request_timeout: 600

# Pfoertner (kai/docs/05_vorschlag-auto-stop.md): startet kai-gpu bei Bedarf und stoppt sie nach Leerlauf.
# false = LiteLLM spricht kai-gpu direkt an, der Pfoertner wird gestoppt (Rueckfall).
kai_pfoertner_enabled: true
# Port des Pfoertners auf der Docker-Bridge (nie nach aussen).
kai_pfoertner_port: 8081
# Logischer Name der GPU-Maschine im Pfad /<name>/v1 und in den Journal-Eintraegen.
kai_pfoertner_machine: kai1
# aws: echte Instanz starten und stoppen; none: Trockenlauf (nur Logzeilen, die Maschine gilt als an).
kai_pfoertner_provider: aws
kai_pfoertner_region: eu-central-1
kai_pfoertner_instance_id: "{{ hostvars[kai_gpu_peer].ansible_host if kai_pfoertner_provider == 'aws' else '' }}"
# Stopp nach so vielen Minuten ohne Anfrage (0 = nie) und frueheste Stoppzeit nach dem Start.
kai_pfoertner_idle_minutes: 30
kai_pfoertner_min_runtime_minutes: 10
# Frueher Start, sobald sich jemand in Open WebUI anmeldet (nur im Zeitfenster, z. B. "7-23"; leer = immer).
# Aus, seit es das CPU-Modell und externe Modelle gibt: eine Anmeldung sagt nicht, dass kai-gpu gebraucht wird;
# geweckt wird nur noch durch eine Anfrage an ein GPU-Modell (LiteLLM ueber den Pfoertner, Filter Kai-Status).
kai_pfoertner_wake_on_login: false
kai_pfoertner_login_window: ""
# Statusseite fuer Nutzer (nur lesend: Zustand der GPU-Maschine und der Dienste), http://<kai-entry>:8082/.
# Eigener Port, weil der Hauptport Modellanfragen weiterreicht und intern bleibt; Zugang begrenzt die
# Security Group (VPN-Bereich auf 8082, Uwe). Leer = aus.
kai_pfoertner_status_listen: "0.0.0.0"
kai_pfoertner_status_port: 8082
kai_pfoertner_status_checks:
  Open WebUI: "http://127.0.0.1:{{ kai_webui_port }}/health"
  LiteLLM: "http://127.0.0.1:{{ kai_litellm_port }}/health/liveliness"

# Laeuft staendig, also aktiviert nur ein Neustart einen automatisch installierten Kernel (Rolle kai_updates).
kai_updates_automatic_reboot: true

# CPU-Modell auf kai-entry (llama-swap im CPU-Image, kai/compose/entry/compose.cpu.yaml): antwortet ohne kai-gpu
# und macht die Ablaeufe LiteLLM -> llama-swap ohne GPU testbar (kai-smoke --target entry --model <name>).
# Gemessen 19.11. auf webui1 (t3.medium): 8 Tok/s, erstes Token nach 1 s bei kurzer Frage, 30 s bei 1k Kontext,
# 2 min bei 3k Kontext; 1,26 GiB RAM geladen. [] = kein CPU-Stack. Dateien stehen in kai/models.list.
kai_entry_cpu_models:
  - name: qwen3-1.7b-cpu
    file: Qwen3-1.7B-Q4_K_M.gguf
    ctx_size: 4096
    # Qwen3 ohne Denkphase: auf der CPU kostet sie Minuten je Antwort.
    enable_thinking: false
    ttl: 600
# Hartes RAM-Limit des CPU-Containers (compose.cpu.yaml); neben dem Stack (~2,4 GB) bleiben auf 4 GB rund 1,5 GB.
kai_entry_cpu_mem_limit: 1600m

# Externe Modelle ueber OpenRouter (kostenlose Varianten ":free"): antworten ohne kai-gpu, Daten gehen an OpenRouter
# und dessen Anbieter, also nichts Vertrauliches (Datenschutz-Regel, Plan offener Punkt 5; Training in den
# OpenRouter-Privacy-Einstellungen abgeschaltet). Konto-Limit aller :free-Modelle zusammen: 20 Anfragen/min,
# 50/Tag. Die Auswahl wechselt bei OpenRouter oft; openrouter/free waehlt je Anfrage ein verfuegbares freies Modell.
# Stand 20.11.2026 (https://openrouter.ai/collections/free-models). Key OPENROUTER_API_KEY in /opt/kai/.env.
# Gemma 4 laeuft bei Google im geteilten Pool und antwortete am 20.11. nur mit 429 "rate-limited upstream";
# der 31B bleibt fuer Bilder drin, statt des 26B-A4B steht Nemotron 3.5 Lightning (schnell, antwortet).
kai_entry_external_models:
  - name: openrouter-free
    model: openrouter/openrouter/free
  - name: nemotron-3-ultra-openrouter
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  - name: gemma-4-31b-openrouter
    model: openrouter/google/gemma-4-31b-it:free
  - name: nemotron-3.5-lightning-openrouter
    model: openrouter/nvidia/nemotron-3.5-lightning:free
  - name: nemotron-3.5-super-vl-openrouter
    model: openrouter/nvidia/nemotron-3.5-super-vl:free
# Sekunden, die LiteLLM auf ein externes Modell wartet (kein Kaltstart, aber lange Antworten mit Denkphase).
kai_entry_external_timeout: 180
