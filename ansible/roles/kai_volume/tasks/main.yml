---
- name: Eingaben pruefen
  ansible.builtin.assert:
    that:
      - kai_volume_label | length > 0
      - kai_volume_mountpoint | length > 0
    quiet: true

- name: Dateisystem-Werkzeuge installieren
  ansible.builtin.apt:
    name: e2fsprogs
    state: present

- name: Dateisystem mit dem Label suchen
  ansible.builtin.command:
    cmd: blkid -L {{ kai_volume_label }}
  register: kai_volume_found
  changed_when: false
  check_mode: false
  failed_when: kai_volume_found.rc not in [0, 2]

- name: Datenplatte benannt verlangen
  ansible.builtin.assert:
    that: kai_volume_device | length > 0
    fail_msg: >-
      kai_volume_device fehlt (Pfad unter /dev/disk/by-id in den host_vars);
      ohne Dateisystem mit dem Label {{ kai_volume_label }} wird keine Platte erraten.
    quiet: true
  when: kai_volume_found.rc != 0 and kai_volume_required | bool

- name: Datenplatte aufloesen
  ansible.builtin.command:
    cmd: realpath --canonicalize-existing {{ kai_volume_device }}
  register: kai_volume_real
  changed_when: false
  check_mode: false
  when: kai_volume_found.rc != 0 and kai_volume_required | bool

- name: Datenplatte untersuchen
  ansible.builtin.command:
    cmd: lsblk --json --paths --output NAME,TYPE,FSTYPE {{ kai_volume_real.stdout }}
  register: kai_volume_lsblk
  changed_when: false
  check_mode: false
  when: kai_volume_found.rc != 0 and kai_volume_required | bool

- name: Leere Platte verlangen
  ansible.builtin.assert:
    that:
      - kai_volume_disk.type == 'disk'
      - kai_volume_disk.fstype is none
      - kai_volume_disk.children is not defined
    fail_msg: >-
      {{ kai_volume_device }} ({{ kai_volume_disk.name }}) ist keine leere Platte
      (Typ {{ kai_volume_disk.type }}, Dateisystem {{ kai_volume_disk.fstype }}).
    quiet: true
  vars:
    kai_volume_disk: "{{ (kai_volume_lsblk.stdout | from_json).blockdevices | first }}"
  when: kai_volume_found.rc != 0 and kai_volume_required | bool

- name: Dateisystem mit dem Label anlegen
  ansible.builtin.command:
    cmd: mkfs.{{ kai_volume_fstype }} -L {{ kai_volume_label }} {{ kai_volume_real.stdout }}
  changed_when: true
  when: kai_volume_found.rc != 0 and kai_volume_required | bool

- name: Volume per Label einbinden
  ansible.posix.mount:
    path: "{{ kai_volume_mountpoint }}"
    src: "LABEL={{ kai_volume_label }}"
    fstype: "{{ kai_volume_fstype }}"
    opts: defaults,nofail
    state: mounted
  when: kai_volume_found.rc == 0 or kai_volume_required | bool

- name: Einhaengepunkt als Verzeichnis sicherstellen (ohne Volume)
  ansible.builtin.file:
    path: "{{ kai_volume_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: kai_volume_found.rc != 0 and not kai_volume_required | bool
