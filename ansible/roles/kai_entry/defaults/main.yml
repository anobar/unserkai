---
# Installationsverzeichnis auf der Maschine (Mountpunkt des Volumes kai-data).
kai_entry_install_dir: /opt/kai
# Verzeichnis mit compose.yaml und litellm.yaml.j2 im Repo.
kai_entry_src_dir: "{{ playbook_dir }}/../../kai/compose/entry"
# Bind-Adressen und Ports (kai_webui_bind, kai_litellm_bind, kai_webui_port, kai_litellm_port)
# stehen in group_vars/kai_entry.yml.
# Sekunden, die 'docker compose up --wait' auf gesunde Dienste wartet.
kai_entry_wait_timeout: 300
# Optional: fertige .env, die ein Mensch vorab auf der Maschine ablegt (root, 0600); leer = .env muss schon in
# kai_entry_install_dir liegen. Die Rolle kopiert sie nur, wenn dort keine .env existiert.
kai_entry_env_seed: ""
# CPU-Modelle auf kai-entry (kai/compose/entry/compose.cpu.yaml, llama-swap.yaml.j2); Eintraege wie kai_gpu_models
# (name, file, ctx_size, optional enable_thinking, ttl, parallel, threads, nice), Dateien aus kai/models.list.
# [] = kein CPU-Stack. Belegt ist die Liste in group_vars/kai_entry.yml.
kai_entry_cpu_models: []
kai_entry_cpu_mem_limit: 1600m
kai_entry_models_dir: "{{ kai_entry_install_dir }}/models"
kai_entry_models_pull_src: "{{ playbook_dir }}/../../kai/bin/kai-models-pull"
kai_entry_models_list_src: "{{ playbook_dir }}/../../kai/models.list"
# Externe Modelle in LiteLLM: Eintraege mit name (Name in Open WebUI), model (LiteLLM-Modellstring mit
# Anbieter-Praefix) und optional api_key_env (Variable in .env, Standard OPENROUTER_API_KEY); die Rolle prueft,
# dass jede genannte Variable in .env gesetzt ist. [] = keine. Belegt in group_vars/kai_entry.yml.
kai_entry_external_models: []
kai_entry_external_timeout: 180
# Gemeinsame Argumente fuer jeden 'docker compose'-Aufruf der Rolle; mit CPU-Modell kommt compose.cpu.yaml dazu.
kai_entry_compose_args: >-
  --project-directory {{ kai_entry_install_dir }}
  --env-file {{ kai_entry_install_dir }}/.env
  --env-file {{ kai_entry_install_dir }}/stack.env
  -f {{ kai_entry_install_dir }}/compose.yaml
  {{ '-f ' ~ kai_entry_install_dir ~ '/compose.cpu.yaml' if kai_entry_cpu_models | length > 0 else '' }}
# Freier Platz in GB unter /var/lib/docker, bevor ein fehlendes Image geladen wird (Images zusammen etwa 10 GB).
kai_entry_min_free_gb: 8
