---
- name: Unterstuetzte Distribution pruefen
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
    fail_msg: >-
      Diese Rolle unterstuetzt nur Debian.
      Gefunden: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
    quiet: true

- name: Proxy fuer apt eintragen
  ansible.builtin.copy:
    content: |
      Acquire::http::Proxy "{{ kai_http_proxy }}";
      Acquire::https::Proxy "{{ kai_http_proxy }}";
    dest: /etc/apt/apt.conf.d/90kai-proxy
    owner: root
    group: root
    mode: "0644"
  when: kai_http_proxy | default('') | length > 0

- name: Proxy fuer apt entfernen
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/90kai-proxy
    state: absent
  when: kai_http_proxy | default('') | length == 0

- name: Paketindex aktualisieren
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Vorhandene Pakete aktualisieren
  ansible.builtin.apt:
    upgrade: safe
  when: common_upgrade_packages | bool

- name: Basispakete installieren
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Zeitzone ueber /etc/localtime setzen
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Zeitzone in /etc/timezone eintragen
  ansible.builtin.copy:
    content: "{{ common_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"

# Namen, die noch kein DNS aufloest (Overlay inventory/local/); leer = nichts eintragen.
- name: Zusaetzliche Hosts-Eintraege setzen
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} kai_extra_hosts"
    block: |
      {% for name, ip in kai_extra_hosts.items() %}
      {{ ip }} {{ name }}
      {% endfor %}
  when: kai_extra_hosts | default({}) | length > 0
