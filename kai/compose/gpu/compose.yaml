# Kai GPU-Stack (kai-gpu): llama-swap mit llama.cpp.
# Ohne GPU (Test-VM) kommt zusaetzlich compose.cpu.yaml dazu, das die Reservierung entfernt;
# Image wird mit kai/bin/kai-pin-images auf Tag + Digest gepinnt.
name: kai-gpu

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda13-2026-10-20@sha256:6b175cdcef92c0f8bfb1c44511e5305f0b9b8026958ff710a69b690bb8299765
    restart: unless-stopped
    env_file:
      - path: ./proxy.env
        required: false
    ports:
      - "${KAI_GPU_BIND:-127.0.0.1}:${KAI_GPU_PORT:-8080}:8080"
    volumes:
      - ./llama-swap.yaml:/etc/llama-swap/config/config.yaml:ro
      - ${KAI_MODELS_DIR:-/opt/kai/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Das Image hat weder wget noch curl; bash spricht HTTP ueber /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
