# Zusatzdatei fuer das CPU-Modell auf kai-entry (kai_entry_cpu_models nicht leer):
#   docker compose -f compose.yaml -f compose.cpu.yaml up -d
# llama-swap mit llama.cpp auf der CPU, dasselbe Image wie die Test-VM kai-gpu-pre (kai/compose/gpu/compose.cpu.yaml);
# es liest die Konfiguration aus /app/config.yaml. Kein Host-Port: nur LiteLLM spricht es an (http://llama-swap:8080).
services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:v266-cpu-b11804@sha256:8096337ff965c5732af90b23fd100feaff6fabeceeef557466598565469b4a86
    restart: unless-stopped
    # .env traegt LLAMA_SWAP_KEY (derselbe Wert wie fuer kai-gpu); llama-swap liest ihn als ${env.LLAMA_SWAP_KEY}.
    env_file: .env
    volumes:
      - ./llama-swap.yaml:/app/config.yaml:ro
      - ${KAI_MODELS_DIR:-/opt/kai/models}:/models:ro
    # Darf nichts aus dem RAM verdraengen: hartes Limit ohne Swap; bei Ueberschreitung stirbt nur dieser Container.
    # Gemessen 19.11. auf webui1: Qwen3-1.7B Q4_K_M mit 4096 Kontext belegt 1,26 GiB.
    mem_limit: ${KAI_CPU_MEM_LIMIT:-1600m}
    memswap_limit: ${KAI_CPU_MEM_LIMIT:-1600m}
    # Niedrige CPU-Prioritaet gegenueber den anderen Containern (cpu.weight 21 statt 100); das nice im cmd
    # von llama-swap.yaml wirkt nur innerhalb dieses Containers.
    cpu_shares: 128
    networks: [kai]
    healthcheck:
      # Das Image hat weder wget noch curl; bash spricht HTTP ueber /dev/tcp. Mit apiKeys verlangt auch /health den Key.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nAuthorization: Bearer %s\r\n\r\n' "$$LLAMA_SWAP_KEY" >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
