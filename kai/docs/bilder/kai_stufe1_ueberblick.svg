<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Kai, Stufe 1: Alles auf einer Maschine</title>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="44" font-size="28" font-weight="bold" fill="#1f2937" text-anchor="middle">Kai, Stufe 1: Alles auf einer Maschine</text>

  <!-- users -->
  <rect x="40" y="150" width="90" height="60" rx="6" fill="#d9dee7" stroke="#9ca3af"/>
  <rect x="70" y="212" width="30" height="8" fill="#9ca3af"/>
  <rect x="55" y="220" width="60" height="5" fill="#9ca3af"/>
  <text x="85" y="186" font-size="17" fill="#1f2937" text-anchor="middle">PC</text>
  <rect x="150" y="140" width="40" height="80" rx="8" fill="#d9dee7" stroke="#9ca3af"/>
  <circle cx="170" cy="210" r="3" fill="#6b7280"/>
  <text x="170" y="184" font-size="14" fill="#4b5563" text-anchor="middle">Tel.</text>
  <rect x="40" y="270" width="90" height="60" rx="6" fill="#d9dee7" stroke="#9ca3af"/>
  <rect x="70" y="332" width="30" height="8" fill="#9ca3af"/>
  <rect x="55" y="340" width="60" height="5" fill="#9ca3af"/>
  <text x="85" y="306" font-size="17" fill="#1f2937" text-anchor="middle">PC</text>
  <rect x="150" y="260" width="40" height="80" rx="8" fill="#d9dee7" stroke="#9ca3af"/>
  <circle cx="170" cy="330" r="3" fill="#6b7280"/>
  <text x="170" y="304" font-size="14" fill="#4b5563" text-anchor="middle">Tel.</text>
  <text x="115" y="385" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Uwe, Axel,</text>
  <text x="115" y="408" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Nic, Martin</text>

  <!-- access arrow (both directions) -->
  <line x1="212" y1="245" x2="293" y2="245" stroke="#3b5b8c" stroke-width="2.5"/>
  <polygon points="203,245 213,240 213,250" fill="#3b5b8c"/>
  <polygon points="302,245 292,240 292,250" fill="#3b5b8c"/>
  <text x="252" y="228" font-size="14" fill="#4b5563" text-anchor="middle">gesicherter</text>
  <text x="252" y="270" font-size="14" fill="#4b5563" text-anchor="middle">Zugang (VPN)</text>

  <!-- machine -->
  <rect x="305" y="90" width="700" height="590" rx="16" fill="#f3f6fa" stroke="#9db0cc" stroke-width="2"/>
  <text x="655" y="122" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Gemietete GPU-Maschine in Amazons Rechenzentrum Frankfurt</text>
  <text x="655" y="144" font-size="14" fill="#4b5563" text-anchor="middle">eine Maschine, an/aus per Hand</text>

  <!-- open webui -->
  <rect x="335" y="185" width="260" height="120" rx="10" fill="#e3eaf4" stroke="#9db0cc" stroke-width="1.5"/>
  <text x="465" y="218" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Chat-Oberfläche</text>
  <text x="465" y="241" font-size="17" fill="#1f2937" text-anchor="middle">(Open WebUI)</text>
  <text x="465" y="268" font-size="14" fill="#4b5563" text-anchor="middle">Konten, Chat-Verlauf,</text>
  <text x="465" y="287" font-size="14" fill="#4b5563" text-anchor="middle">hochgeladene Dokumente</text>

  <!-- llama-swap -->
  <rect x="715" y="185" width="260" height="120" rx="10" fill="#e3eaf4" stroke="#9db0cc" stroke-width="1.5"/>
  <text x="845" y="218" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Modell-Weiche</text>
  <text x="845" y="241" font-size="17" fill="#1f2937" text-anchor="middle">(llama-swap)</text>
  <text x="845" y="268" font-size="14" fill="#4b5563" text-anchor="middle">lädt das gewünschte Modell</text>
  <text x="845" y="287" font-size="14" fill="#4b5563" text-anchor="middle">auf die Grafikkarte</text>

  <!-- UI <-> swap -->
  <line x1="605" y1="245" x2="705" y2="245" stroke="#3b5b8c" stroke-width="2.5"/>
  <polygon points="596,245 606,240 606,250" fill="#3b5b8c"/>
  <polygon points="714,245 704,240 704,250" fill="#3b5b8c"/>
  <text x="655" y="232" font-size="14" fill="#4b5563" text-anchor="middle">Frage / Antwort</text>

  <!-- model -->
  <rect x="715" y="360" width="260" height="120" rx="10" fill="#e3eaf4" stroke="#9db0cc" stroke-width="1.5"/>
  <text x="845" y="393" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Sprachmodell</text>
  <text x="845" y="416" font-size="17" fill="#1f2937" text-anchor="middle">auf der Grafikkarte</text>
  <text x="845" y="443" font-size="14" fill="#4b5563" text-anchor="middle">llama.cpp, Modell gpt-oss-20b</text>
  <text x="845" y="462" font-size="14" fill="#4b5563" text-anchor="middle">rechnet die Antwort, speichert nichts</text>
  <!-- swap <-> model -->
  <line x1="845" y1="315" x2="845" y2="350" stroke="#3b5b8c" stroke-width="2.5"/>
  <polygon points="845,306 840,316 850,316" fill="#3b5b8c"/>
  <polygon points="845,359 840,349 850,349" fill="#3b5b8c"/>

  <!-- brave mcp -->
  <rect x="335" y="360" width="260" height="120" rx="10" fill="#f6e8d8" stroke="#d4a26e" stroke-width="1.5"/>
  <text x="465" y="393" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Websuche-Werkzeug</text>
  <text x="465" y="416" font-size="17" fill="#1f2937" text-anchor="middle">(Brave MCP)</text>
  <text x="465" y="443" font-size="14" fill="#4b5563" text-anchor="middle">wird nur benutzt, wenn das Modell</text>
  <text x="465" y="462" font-size="14" fill="#4b5563" text-anchor="middle">aktuelle Informationen braucht</text>
  <!-- UI <-> tool (dashed) -->
  <line x1="465" y1="315" x2="465" y2="350" stroke="#b8651b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <polygon points="465,306 460,316 470,316" fill="#b8651b"/>
  <polygon points="465,359 460,349 470,349" fill="#b8651b"/>
  <text x="480" y="337" font-size="14" fill="#b8651b">Werkzeug-Aufruf</text>

  <!-- tool -> external brave (dashed) -->
  <line x1="595" y1="465" x2="655" y2="465" stroke="#b8651b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="655" y1="465" x2="655" y2="520" stroke="#b8651b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="655" y1="520" x2="1026" y2="520" stroke="#b8651b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <polygon points="1035,520 1025,515 1025,525" fill="#b8651b"/>
  <text x="840" y="541" font-size="14" fill="#b8651b" text-anchor="middle">nur die Suchanfrage geht nach draußen,</text>
  <text x="840" y="559" font-size="14" fill="#b8651b" text-anchor="middle">kein Konto und kein Chat-Verlauf</text>
  <ellipse cx="1105" cy="520" rx="70" ry="38" fill="#f6e8d8" stroke="#d4a26e" stroke-width="1.5"/>
  <text x="1105" y="516" font-size="17" fill="#1f2937" text-anchor="middle">Brave Suche</text>
  <text x="1105" y="536" font-size="14" fill="#4b5563" text-anchor="middle">(extern)</text>

  <!-- disk -->
  <path d="M375,560 a140,16 0 0 1 280,0 v70 a140,16 0 0 1 -280,0 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <ellipse cx="515" cy="560" rx="140" ry="16" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="515" y="597" font-size="17" fill="#1f2937" text-anchor="middle">Platte (bleibt beim Ausschalten)</text>
  <text x="515" y="618" font-size="14" fill="#4b5563" text-anchor="middle">Chats, Dokumente, Modelldateien</text>
  <text x="515" y="637" font-size="14" fill="#4b5563" text-anchor="middle">Sicherung per Snapshot</text>
  <!-- UI -> disk -->
  <line x1="465" y1="485" x2="465" y2="532" stroke="#3b5b8c" stroke-width="2.5"/>
  <polygon points="465,541 460,531 470,531" fill="#3b5b8c"/>
  <text x="480" y="515" font-size="14" fill="#4b5563">speichert</text>
  <text x="820" y="595" font-size="14" fill="#4b5563" text-anchor="middle">Zugriff auf die Platte hat nur,</text>
  <text x="820" y="614" font-size="14" fill="#4b5563" text-anchor="middle">wer die Maschine verwaltet (Uwe, Axel)</text>

  <!-- legend -->
  <text x="1025" y="595" font-size="18" font-weight="bold" fill="#1f2937">Legende</text>
  <line x1="1025" y1="620" x2="1057" y2="620" stroke="#3b5b8c" stroke-width="2.5"/>
  <polygon points="1065,620 1055,615 1055,625" fill="#3b5b8c"/>
  <text x="1075" y="625" font-size="14" fill="#4b5563">Frage / Antwort</text>
  <line x1="1025" y1="650" x2="1057" y2="650" stroke="#b8651b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <polygon points="1065,650 1055,645 1055,655" fill="#b8651b"/>
  <text x="1075" y="655" font-size="14" fill="#4b5563">Werkzeug-Aufruf</text>
  <rect x="1025" y="671" width="40" height="20" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1075" y="686" font-size="14" fill="#4b5563">Daten bleiben hier</text>
</svg>
