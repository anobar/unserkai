<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Arial, sans-serif">
  <title>Kai: Stufe 1 (heute) und Stufe 2 (später)</title>
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Kai: Stufe 1 (heute) und Stufe 2 (später)</text>

  <!-- Vertical divider -->
  <line x1="600" y1="70" x2="600" y2="640" stroke="#cccccc" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN: Stufe 1 ==================== -->
  <text x="300" y="95" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Heute: Stufe 1 — eine Maschine</text>

  <!-- Users icon -->
  <g transform="translate(260, 120)">
    <!-- Person 1 -->
    <circle cx="10" cy="10" r="7" fill="#2563eb"/>
    <path d="M0,30 Q10,20 20,30 L20,38 L0,38 Z" fill="#2563eb"/>
    <!-- Person 2 -->
    <circle cx="30" cy="10" r="7" fill="#2563eb"/>
    <path d="M20,30 Q30,20 40,30 L40,38 L20,38 Z" fill="#2563eb"/>
    <!-- Person 3 -->
    <circle cx="50" cy="10" r="7" fill="#2563eb"/>
    <path d="M40,30 Q50,20 60,30 L60,38 L40,38 Z" fill="#2563eb"/>
    <!-- Person 4 -->
    <circle cx="70" cy="10" r="7" fill="#2563eb"/>
    <path d="M60,30 Q70,20 80,30 L80,38 L60,38 Z" fill="#2563eb"/>
  </g>
  <text x="300" y="175" font-size="18" fill="#2563eb" text-anchor="middle">4 Nutzer</text>

  <!-- Arrow down from users to GPU box -->
  <line x1="300" y1="185" x2="300" y2="215" stroke="#2563eb" stroke-width="2"/>
  <polygon points="300,222 295,215 305,215" fill="#2563eb"/>

  <!-- Large green GPU box -->
  <rect x="100" y="225" width="400" height="280" rx="16" ry="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="300" y="255" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">GPU-Maschine</text>
  <text x="300" y="278" font-size="18" fill="#065f46" text-anchor="middle">(an/aus per Hand)</text>

  <!-- Inner box 1: Chat-Oberfläche -->
  <rect x="130" y="295" width="340" height="70" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="320" font-size="18" fill="#1e40af" text-anchor="middle">Chat-Oberfläche</text>
  <text x="300" y="345" font-size="18" fill="#1e40af" text-anchor="middle">+ Konten + Verlauf</text>

  <!-- Inner box 2: Sprachmodell -->
  <rect x="130" y="385" width="340" height="70" rx="10" ry="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="300" y="410" font-size="18" fill="#065f46" text-anchor="middle">Sprachmodell</text>
  <text x="300" y="435" font-size="18" fill="#065f46" text-anchor="middle">auf Grafikkarte</text>

  <!-- Note below left column -->
  <text x="300" y="530" font-size="14" fill="#6b7280" text-anchor="middle">Aus = alles aus, auch der</text>
  <text x="300" y="550" font-size="14" fill="#6b7280" text-anchor="middle">Chat-Verlauf ist dann nicht erreichbar</text>

  <!-- ==================== RIGHT COLUMN: Stufe 2 ==================== -->
  <text x="900" y="95" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Später: Stufe 2 — getrennt</text>

  <!-- Users icon -->
  <g transform="translate(860, 120)">
    <!-- Person 1 -->
    <circle cx="10" cy="10" r="7" fill="#2563eb"/>
    <path d="M0,30 Q10,20 20,30 L20,38 L0,38 Z" fill="#2563eb"/>
    <!-- Person 2 -->
    <circle cx="30" cy="10" r="7" fill="#2563eb"/>
    <path d="M20,30 Q30,20 40,30 L40,38 L20,38 Z" fill="#2563eb"/>
    <!-- Person 3 -->
    <circle cx="50" cy="10" r="7" fill="#2563eb"/>
    <path d="M40,30 Q50,20 60,30 L60,38 L40,38 Z" fill="#2563eb"/>
    <!-- Person 4 -->
    <circle cx="70" cy="10" r="7" fill="#2563eb"/>
    <path d="M60,30 Q70,20 80,30 L80,38 L60,38 Z" fill="#2563eb"/>
  </g>
  <text x="900" y="175" font-size="18" fill="#2563eb" text-anchor="middle">4 Nutzer</text>

  <!-- Arrow down from users to grey box -->
  <line x1="900" y1="185" x2="900" y2="215" stroke="#2563eb" stroke-width="2"/>
  <polygon points="900,222 895,215 905,215" fill="#2563eb"/>

  <!-- Grey box: Kleine Dauer-Maschine -->
  <rect x="700" y="225" width="400" height="100" rx="16" ry="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="900" y="252" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Kleine Dauer-Maschine</text>
  <text x="900" y="275" font-size="18" fill="#374151" text-anchor="middle">Chat-Oberfläche, Konten,</text>
  <text x="900" y="298" font-size="18" fill="#374151" text-anchor="middle">Verlauf, Werkzeuge</text>
  <text x="900" y="318" font-size="14" fill="#6b7280" text-anchor="middle">(läuft immer, günstig)</text>

  <!-- Three arrows down from grey box to three boxes -->
  <!-- Arrow to box A (left) -->
  <line x1="780" y1="325" x2="780" y2="365" stroke="#6b7280" stroke-width="2"/>
  <polygon points="780,372 775,365 785,365" fill="#6b7280"/>

  <!-- Arrow to box B (center) -->
  <line x1="900" y1="325" x2="900" y2="365" stroke="#6b7280" stroke-width="2"/>
  <polygon points="900,372 895,365 905,365" fill="#6b7280"/>

  <!-- Arrow to box C (right) -->
  <line x1="1020" y1="325" x2="1020" y2="365" stroke="#6b7280" stroke-width="2"/>
  <polygon points="1020,372 1015,365 1025,365" fill="#6b7280"/>

  <!-- Box A: GPU-Maschine A (green solid) -->
  <rect x="670" y="375" width="150" height="100" rx="12" ry="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="745" y="405" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">GPU-Maschine A</text>
  <text x="745" y="430" font-size="16" fill="#065f46" text-anchor="middle">(klein, meist an)</text>

  <!-- Box B: GPU-Maschine B (green dashed) -->
  <rect x="840" y="375" width="140" height="100" rx="12" ry="12" fill="#d1fae5" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="910" y="405" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">GPU-Maschine B</text>
  <text x="910" y="430" font-size="16" fill="#065f46" text-anchor="middle">(groß, nur</text>
  <text x="910" y="452" font-size="16" fill="#065f46" text-anchor="middle">bei Bedarf)</text>

  <!-- Box C: Externer KI-Dienst (grey dashed) -->
  <rect x="1000" y="375" width="140" height="100" rx="12" ry="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1070" y="405" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Externer</text>
  <text x="1070" y="428" font-size="16" fill="#374151" text-anchor="middle">KI-Dienst</text>
  <text x="1070" y="450" font-size="14" fill="#6b7280" text-anchor="middle">(optional, nur mit</text>
  <text x="1070" y="468" font-size="14" fill="#6b7280" text-anchor="middle">Schutz der Daten)</text>

  <!-- Note below right column -->
  <text x="900" y="510" font-size="14" fill="#6b7280" text-anchor="middle">Chat bleibt erreichbar, Modelle</text>
  <text x="900" y="530" font-size="14" fill="#6b7280" text-anchor="middle">werden zugeschaltet, Kosten</text>
  <text x="900" y="550" font-size="14" fill="#6b7280" text-anchor="middle">nur wenn genutzt</text>

  <!-- ==================== BOTTOM STRIP ==================== -->
  <rect x="80" y="660" width="1040" height="70" rx="14" ry="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="688" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">Was gleich bleibt:</text>
  <text x="600" y="715" font-size="18" fill="#1e40af" text-anchor="middle">dieselbe Oberfläche, dieselben Konten und Chat-Verläufe — der Umzug ist ein Umstecken, kein Neuanfang</text>
</svg>
